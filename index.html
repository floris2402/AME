<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f9f9f9;
            line-height: 1.6;
        }
        header {
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            background: #e2e8f0;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #34495e;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }
        nav a {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #3498db;
        }
        main {
            padding: 4rem 2rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        main h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        main p {
            font-size: 1.1rem;
            color: #666;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            nav ul {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo">A</div>
            <span class="title">AME</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Accueil</a></li>
                <li><a href="#">À propos</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Bienvenue sur AME</h1>
        <p>Ton mini site est en ligne, responsive et prêt à l'emploi.</p>
    </main>

</body>
</html>
